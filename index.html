<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OPS SYSTEM GO - V45 CLOUD</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    
    <style>
        /* تصميمك الأصلي اللي أنت بتحبه */
        :root { --blue: #0f172a; --accent: #3b82f6; --red: #e11d48; --green: #10b981; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 320px; text-align: center; }
        #adminPanel { margin-top: 30px; display: none; background: #fffbeb; padding: 20px; border-radius: 12px; border: 2px solid #f59e0b; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        th { background: var(--blue); color: white; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h1>OPS SYSTEM GO</h1>
        <input type="text" id="username" placeholder="Username" style="width:90%; padding:12px; margin-bottom:10px;"><br>
        <input type="password" id="password" placeholder="Password" style="width:90%; padding:12px; margin-bottom:20px;"><br>
        <button onclick="login()" style="width:100%; padding:14px; background:var(--blue); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">SIGN IN</button>
    </div>
</div>

<div class="container" id="mainApp" style="display:none;">
    <h2>OPS MAIN CONTROL <span id="userInfo" style="font-size:12px; color:var(--accent)"></span></h2>
    
    <textarea id="rawInput" placeholder="PASTE FLIGHT DATA HERE..."></textarea>
    <button onclick="processData()" style="width:100%; padding:14px; background:var(--blue); color:white; border:none; border-radius:8px; margin:10px 0;">RUN ANALYZER</button>

    <div id="adminPanel">
        <h2 style="border-color:#f59e0b">LIVE ACTIVITY LOG (ADMIN)</h2>
        <table>
            <thead><tr><th>USER</th><th>ACTION</th><th>DETAILS</th><th>TIME (SEC)</th></tr></thead>
            <tbody id="adminLogBody"></tbody>
        </table>
    </div>
</div>

<script>
    // بيانات الـ Firebase اللي أنت لسه بعتها (الربط الفعلي)
    const firebaseConfig = {
      apiKey: "AIzaSyAMs5A2t0tx_q1U_CUtS4NbMP2ELfEozXw",
      authDomain: "ops-system-pro.firebaseapp.com",
      projectId: "ops-system-pro",
      storageBucket: "ops-system-pro.firebasestorage.app",
      messagingSenderId: "197480388481",
      appId: "1:197480388481:web:390bfd0fbb989db6897a80"
    };

    // تشغيل السيرفر
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log("Firebase Initialized ✅");

    let currentUser = "";
    const users = { "admin": "zas123", "ghobesh": "ops01", "shaker": "ops02", "jan": "ops03", "amani": "ops04", "abdelrahman": "ops05" };

    function trackAction(act, det = "") {
        db.collection("system_logs").add({
            user: currentUser,
            action: act,
            details: det,
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    function login() {
        const u = document.getElementById('username').value.toLowerCase();
        const p = document.getElementById('password').value;
        if(users[u] && users[u] === p) {
            currentUser = u;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // تسجيل حركة دخول بالساعة والدقيقة والثانية
            trackAction("Login", "User entered the system");

            if(u === 'admin') {
                document.getElementById('adminPanel').style.display = 'block';
                loadLogs();
            }
        } else { alert("Wrong Data!"); }
    }

    function loadLogs() {
        db.collection("system_logs").orderBy("time", "desc").limit(15).onSnapshot(snap => {
            const tbody = document.getElementById('adminLogBody');
            tbody.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                // التوقيت بالثانية
                const t = d.time ? d.time.toDate().toLocaleTimeString('en-GB') : "Syncing...";
                tbody.innerHTML += `<tr><td><b>${d.user.toUpperCase()}</b></td><td>${d.action}</td><td>${d.details}</td><td>${t}</td></tr>`;
            });
        });
    }

    // هنا بتكمل باقي وظائف الـ Analyzer بتاعتك من الملف القديم...
    function processData() {
        trackAction("Used Analyzer", "User processed flight data");
        // ... (باقي الكود بتاع الـ Logic)
        alert("Data Processed & Logged!");
    }
</script>
</body>
</html>
