<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS-SYSTEM-PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #000; --accent: #ffd700; --text: #fff; }
        body { font-family: sans-serif; background: var(--primary); color: var(--text); margin: 0; padding: 15px; }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .log-table th, .log-table td { border: 1px solid #333; padding: 8px; text-align: center; }
        #adminView { display: none; }
    </style>
</head>
<body>

    <div id="loginPage" class="card">
        <h2>تسجيل دخول العمليات</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleLogin()">دخول</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="card">
            <h3>إضافة رحلة جديدة (Cloud Sync)</h3>
            <input type="text" id="f_num" placeholder="رقم الرحلة">
            <input type="text" id="f_reg" placeholder="تسجيل الطائرة (Registration)">
            <select id="f_status">
                <option value="Pending">قيد التنفيذ (Pending)</option>
                <option value="Completed">مكتملة (Completed)</option>
            </select>
            <button onclick="saveFlight()">حفظ وإرسال للسحابة</button>
        </div>

        <div id="adminView" class="card">
            <h3>سجل مراقبة النظام (Logs)</h3>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>الموظف</th>
                        <th>الحركة</th>
                        <th>التوقيت</th>
                    </tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
        
        <button onclick="handleLogout()" style="background:#ff4444; color:#fff;">تسجيل خروج</button>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAMs5A2t0tx_q1U_CUtS4NbMP2ELfEozXw",
            authDomain: "ops-system-pro.firebaseapp.com",
            projectId: "ops-system-pro",
            storageBucket: "ops-system-pro.firebasestorage.app",
            messagingSenderId: "197480388481",
            appId: "1:197480388481:web:66aacf19a6ba4878897a80"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentUser = "";

        // نظام المراقبة: تسجيل كل حركة
        function logAction(action, details = "") {
            db.collection("system_logs").add({
                user: currentUser,
                action: action,
                details: details,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // التحقق من اليوزرات
            const users = { 'admin': 'zas123', 'youssef': 'ops06', 'tamer': 'ops07', 'moalaa': 'ops08' };

            if (users[u] && users[u] === p) {
                currentUser = u;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                
                logAction("Login", "دخل النظام");

                if (u === 'admin') {
                    document.getElementById('adminView').style.display = 'block';
                    loadLogs();
                }
            } else {
                alert("بيانات الدخول غير صحيحة");
            }
        }

        async function saveFlight() {
            const data = {
                num: document.getElementById('f_num').value,
                reg: document.getElementById('f_reg').value,
                status: document.getElementById('f_status').value,
                user: currentUser
            };

            await db.collection("flights").add({
                ...data,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            logAction("Add Flight", `أضاف رحلة: ${data.num}`);
            alert("تم الحفظ في السحابة بنجاح ✅");
        }

        function loadLogs() {
            db.collection("system_logs").orderBy("time", "desc").limit(20).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const t = d.time ? d.time.toDate().toLocaleTimeString() : "...";
                    html += `<tr><td>${d.user}</td><td>${d.action}</td><td>${t}</td></tr>`;
                });
                document.getElementById('logsBody').innerHTML = html;
            });
        }

        function handleLogout() {
            logAction("Logout", "خرج من النظام");
            location.reload();
        }
    </script>
</body>
</html>
